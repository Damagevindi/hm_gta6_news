name: Update GTA 6 News

on:
  schedule:
    - cron: '0 */3 * * *'   # alle 3 Stunden
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Commit updated news.json
        run: |
          git config user.name "gta6-news-bot"
          git config user.email "bot@hm-gta6-news.local"
          git add docs/news.json
          git diff --quiet --cached || git commit -m "chore: update news.json [skip ci]"
          git push
